apiVersion: v2
name: keycloak-operator
description: |
  A Helm chart for the Keycloak Operator (k8s.keycloak.org).
  Deploys the official operator from the Keycloak project, installs the Keycloak
  CRDs (Keycloak, KeycloakRealmImport, KeycloakOIDCClient, KeycloakSAMLClient)
  and can optionally manage Keycloak instances through Custom Resources.
  Runs cluster-wide by default (can be restricted to a set of namespaces).
type: application
# Chart version follows the upstream Keycloak / Keycloak Operator version.
version: 26.7.2
appVersion: "26.7.2"
keywords:
  - keycloak
  - operator
  - identity
  - sso
  - oidc
  - saml
  - authentication
home: https://github.com/akopyanlabs/keycloak-operator
sources:
  - https://github.com/akopyanlabs/keycloak-operator
  - https://github.com/keycloak/keycloak
maintainers:
  - name: Armen Akopyan
annotations:
  artifacthub.io/category: "security"
  artifacthub.io/license: "Apache-2.0"
  artifacthub.io/links: |
    - name: Keycloak Operator documentation
      url: https://www.keycloak.org/operator
    - name: Source
      url: https://github.com/keycloak/keycloak
